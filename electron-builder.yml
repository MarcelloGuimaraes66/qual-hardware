appId: ai.aiquimist.qualhardware
productName: Qual Hardware
copyright: Copyright © 2026 Aiquimist
asar: true
# The application has no third-party native Node modules. The only native
# helper is built explicitly by `npm run native:build`, so electron-rebuild
# would add user-cache access and permission prompts without producing an
# artifact used by the package.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/server/server/index.js"
  - "!dist/server/server/worker.js"
  - contracts/**/*
  - database/**/*
  - package.json
extraResources:
  - from: resources/calibration/runtime-manifest.json
    to: resources/calibration/runtime-manifest.json
  - from: resources/calibration/asset-sources.lock.json
    to: resources/calibration/asset-sources.lock.json
  - from: contracts/calibration-kernel-authority-v1.json
    to: contracts/calibration-kernel-authority-v1.json
  - from: contracts/calibration-pipeline-contract-v1.json
    to: contracts/calibration-pipeline-contract-v1.json
  - from: contracts/calibration-kernel-authority-v2.json
    to: contracts/calibration-kernel-authority-v2.json
  - from: contracts/calibration-pipeline-contract-v2.json
    to: contracts/calibration-pipeline-contract-v2.json
  - from: contracts/calibration-pipeline-contract-v3.json
    to: contracts/calibration-pipeline-contract-v3.json
  - from: contracts/perceptrum-workload-v4.json
    to: contracts/perceptrum-workload-v4.json
  - from: contracts/qwen3-vl-approved-revisions-v1.json
    to: contracts/qwen3-vl-approved-revisions-v1.json
  - from: build/icon.png
    to: resources/qwen-model-probe.png

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: Qual-Hardware-${version}-windows-${arch}-portable.${ext}
  extraResources:
    - from: resources/native/win32-x64/qual-hardware-native-bench.exe
      to: resources/native/win32-x64/qual-hardware-native-bench.exe

portable:
  # A per-launch extraction directory prevents a second portable bootstrap
  # from replacing the resources (including icudtl.dat) used by the running
  # instance. In electron-builder 26.15.x, `true` omits UNPACK_DIR_NAME and
  # therefore selects NSIS $PLUGINSDIR, which is unique to each launcher.
  # Electron's application lock still rejects the duplicate after extraction.
  unpackDirName: true
  requestExecutionLevel: user

mac:
  icon: build/icon.icns
  category: public.app-category.business
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: Qual-Hardware-${version}-macos-${arch}.${ext}
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
      NSExceptionDomains:
        127.0.0.1:
          NSIncludesSubdomains: false
          NSTemporaryExceptionAllowsInsecureHTTPLoads: true
  extraResources:
    - from: resources/native/darwin-arm64/qual-hardware-native-bench
      to: resources/native/darwin-arm64/qual-hardware-native-bench

linux:
  icon: build/icon.png
  syncDesktopName: true
  category: Utility
  executableName: qual-hardware
  synopsis: Qualificação autônoma de hardware para cargas de inteligência artificial
  maintainer: Marcello Guimarães <marcellogmf66@gmail.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  extraResources:
    - from: resources/native/linux-x64/qual-hardware-native-bench
      to: resources/native/linux-x64/qual-hardware-native-bench

appImage:
  artifactName: Qual-Hardware-${version}-linux-${arch}.${ext}

dmg:
  writeUpdateInfo: false

deb:
  artifactName: qual-hardware_${version}_amd64.${ext}

publish: null
